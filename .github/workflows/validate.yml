name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional test dependencies
        run: python -m pip install -r requirements-optional.txt
      - name: Validate portable workflow, adapters, and plugin contracts
        run: python scripts/validate_release.py
